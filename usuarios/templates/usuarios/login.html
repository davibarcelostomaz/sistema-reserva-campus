<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Reserva Campus</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 32px;
            border-radius: 10px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1f2937;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .erro {
            color: #dc2626;
            font-size: 14px;
        }

        .rodape {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Entrar no sistema</h1>

        {% if form.errors %}
            <p class="erro">
                Nome de usuário ou senha inválidos.
            </p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="id_username">
                Nome de usuário
            </label>
            {{ form.username }}

            <label for="id_password">
                Senha
            </label>
            {{ form.password }}

            <button type="submit">Entrar</button>
        </form>

        <div class="rodape">
            Ainda não possui uma conta?
            <a href="{% url 'cadastro' %}">Cadastre-se</a>
        </div>
    </div>
</body>
</html>
