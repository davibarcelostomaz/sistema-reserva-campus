<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - Reserva Campus</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1f2937;
        }

        button {
            padding: 12px 20px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #b91c1c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bem-vindo ao Reserva Campus!</h1>

        <p>
            Olá, <strong>{{ request.user.first_name }}</strong>!
        </p>

        <p>
            Nome de usuário: {{ request.user.username }}
        </p>

        <p>
            Perfil: {{ request.user.get_perfil_display }}
        </p>

        <p>Você está autenticado no sistema.</p>

        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Sair</button>
        </form>
    </div>
</body>
</html>
